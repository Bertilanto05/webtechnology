<!DOCTYPE html>
<html>
<head>
    <title>Online News Portal Registration</title>
</head>
<body>

<h2>Online News Portal - User Registration</h2>

<form action="#" method="post">

    <!-- Text Input -->
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

    <!-- Email Input -->
    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

    <!-- Password -->
    <label for="password">Create Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <!-- Number -->
    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age" min="18" max="100"><br><br>

    <!-- Date -->
    <label for="join">Subscription Date:</label><br>
    <input type="date" id="join" name="join"><br><br>

    <!-- Radio Buttons -->
    <label>Subscription Plan:</label><br>
    <input type="radio" name="plan" value="free"> Free
    <input type="radio" name="plan" value="premium"> Premium<br><br>

    <!-- Checkbox -->
    <label>Favorite News Categories:</label><br>
    <input type="checkbox" name="category" value="politics"> Politics
    <input type="checkbox" name="category" value="sports"> Sports
    <input type="checkbox" name="category" value="technology"> Technology
    <input type="checkbox" name="category" value="entertainment"> Entertainment<br><br>

    <!-- Dropdown -->
    <label for="language">Preferred Language:</label><br>
    <select id="language" name="language">
        <option value="english">English</option>
        <option value="tamil">Tamil</option>
        <option value="hindi">Hindi</option>
    </select><br><br>

    <!-- Datalist -->
    <label for="city">City:</label><br>
    <input list="cities" id="city" name="city" placeholder="Select your city">
    <datalist id="cities">
        <option value="Coimbatore">
        <option value="Chennai">
        <option value="Madurai">
        <option value="Salem">
    </datalist><br><br>

    <!-- Range -->
    <label for="rating">Interest in Daily News:</label><br>
    <input type="range" id="rating" name="rating" min="1" max="10"><br><br>

    <!-- Color -->
    <label for="color">Choose Website Theme Color:</label><br>
    <input type="color" id="color" name="color"><br><br>

    <!-- Submit -->
    <button type="submit">Register</button>

</form>

</body>
</html>
