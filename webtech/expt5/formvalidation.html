
<!DOCTYPE html>
<html>
<head>
    <title>Online News Portal</title>

    <style>
        body {
            font-family: Arial;
            background-color: #e8eef5;
            margin: 0;
        }

        header {
            background-color: #172b4d;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 350px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #172b4d;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #172b4d;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #e63946;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>DAILY NEWS PORTAL</h1>
    <p>Stay Updated with Latest News</p>
</header>

<div class="container">

    <h2>Reader Registration</h2>

    <form id="newsForm">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Email Address</label>
        <input type="text" id="email" placeholder="Enter your email">

        <label>Mobile Number</label>
        <input type="text" id="mobile" placeholder="Enter 10 digit number">

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <label>Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm password">

        <label>Preferred News Category</label>
        <select id="category">
            <option value="">Select Category</option>
            <option>Sports</option>
            <option>Technology</option>
            <option>Politics</option>
            <option>Entertainment</option>
            <option>Business</option>
        </select>

        <button type="submit">Register</button>

    </form>

    <p id="message"></p>

</div>

<script>

document.getElementById("newsForm").addEventListener("submit", function(event) {

    event.preventDefault();

    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var mobile = document.getElementById("mobile").value.trim();
    var password = document.getElementById("password").value;
    var confirm = document.getElementById("confirm").value;
    var category = document.getElementById("category").value;

    var message = document.getElementById("message");

    if (name == "") {
        message.style.color = "red";
        message.innerHTML = "Please enter your name";
    }

    else if (!/^[A-Za-z ]+$/.test(name)) {
        message.style.color = "red";
        message.innerHTML = "Name should contain only letters";
    }

    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        message.style.color = "red";
        message.innerHTML = "Enter a valid email address";
    }

    else if (!/^[0-9]{10}$/.test(mobile)) {
        message.style.color = "red";
        message.innerHTML = "Enter a valid 10 digit mobile number";
    }

    else if (password.length < 8) {
        message.style.color = "red";
        message.innerHTML = "Password must contain at least 8 characters";
    }

    else if (password != confirm) {
        message.style.color = "red";
        message.innerHTML = "Passwords do not match";
    }

    else if (category == "") {
        message.style.color = "red";
        message.innerHTML = "Please select a news category";
    }

    else {
        message.style.color = "green";
        message.innerHTML = "Registration Successful! Welcome to Daily News Portal.";

        document.getElementById("newsForm").reset();
    }

});

</script>

</body>
</html>
